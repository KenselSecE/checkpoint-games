<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:insert="~{fragments/layout :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Checkpoint Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-5" style="max-width: 560px;">
        <div class="card bg-dark border-secondary rounded-4">
            <div class="card-header bg-transparent border-bottom border-secondary-subtle text-center py-4">
                <div class="display-5 text-success mb-2">
                    <i class="bi bi-person-circle"></i>
                </div>
                <h1 class="h3 fw-bold mb-0">My Profile</h1>
            </div>

            <div class="card-body p-4 p-md-5">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item bg-transparent border-secondary-subtle d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-secondary">
                            <i class="bi bi-person me-2"></i>Full Name
                        </span>
                        <span class="fw-semibold" th:text="${user.fullName}">Jordan Harold</span>
                    </li>
                    <li class="list-group-item bg-transparent border-secondary-subtle d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-secondary">
                            <i class="bi bi-at me-2"></i>Username
                        </span>
                        <span class="fw-semibold" th:text="${user.username}">joeyhr2.0</span>
                    </li>
                    <li class="list-group-item bg-transparent border-secondary-subtle d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-secondary">
                            <i class="bi bi-envelope me-2"></i>Email
                        </span>
                        <span class="fw-semibold" th:text="${user.email}">jordanharold@email.com</span>
                    </li>
                    <li class="list-group-item bg-transparent border-secondary-subtle d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-secondary">
                            <i class="bi bi-shield-check me-2"></i>Role
                        </span>
                        <span class="badge rounded-pill px-3 py-2" th:classappend="${user.role.displayName == 'Admin' ? 'bg-danger' : (user.role.displayName == 'Staff' ? 'bg-warning text-dark' : 'bg-success')}" th:text="${user.role.displayName}">Customer</span>
                    </li>
                    <li class="list-group-item bg-transparent border-secondary-subtle d-flex justify-content-between align-items-center px-0 py-3">
                        <span class="text-secondary">
                            <i class="bi bi-calender-check me-2"></i>Member Since:
                        </span>
                        <span class="fw-semibold" th:text="${#temporals.format(user.registeredAt, 'MMMM dd, yyyy')}">October 14, 2026</span>
                    </li>
                </ul>
            </div>

            <div class="card-footer bg-transparent border-top border-secondary-subtle text-center py-3">
                <a th:href="@{/products}" class="btn btn-outline-success rounded-pill px-4">
                    <i class="bi bi-bag me-2"></i>Back to Shop
                </a>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
