<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Users | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{admin/fragments :: adminNav}"></div>
<div class="container">
    <h1 class="mb-3">Manage Users</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr><th>ID</th><th>Username</th><th>Full name</th><th>Email</th><th>Role</th><th>Status</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td>
                    <span th:text="${u.username}"></span>
                    <span th:if="${u.id == currentUserId}" class="badge text-bg-secondary">you</span>
                </td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post">
                        <select name="role" class="form-select form-select-sm" onchange="this.form.submit()"
                                th:disabled="${u.id == currentUserId}">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}"
                                    th:selected="${r == u.role}"></option>
                        </select>
                    </form>
                </td>
                <td>
                    <span th:if="${u.enabled}" class="badge text-bg-success">Active</span>
                    <span th:unless="${u.enabled}" class="badge text-bg-secondary">Disabled</span>
                </td>
                <td class="text-end">
                    <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" class="d-inline">
                        <input type="hidden" name="enable" th:value="${!u.enabled}">
                        <button type="submit" class="btn btn-sm btn-outline-warning"
                                th:disabled="${u.id == currentUserId}"
                                th:text="${u.enabled} ? 'Deactivate' : 'Activate'">Deactivate</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this user permanently?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                th:disabled="${u.id == currentUserId}">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
