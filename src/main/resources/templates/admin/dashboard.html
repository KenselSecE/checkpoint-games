<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | Checkpoint Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{admin/fragments :: adminNav}"></div>
<div class="container">
    <h1 class="mb-4">Admin Dashboard</h1>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card"><div class="card-body">
                <h5 class="card-title">Products</h5>
                <p class="display-6" th:text="${productCount}">0</p>
                <a class="btn btn-outline-light btn-sm" th:href="@{/admin/products}">Manage products</a>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-body">
                <h5 class="card-title">Users</h5>
                <p class="display-6" th:text="${userCount}">0</p>
                <a class="btn btn-outline-light btn-sm" th:href="@{/admin/users}">Manage users</a>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
