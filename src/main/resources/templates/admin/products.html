<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Products | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{admin/fragments :: adminNav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Manage Products</h1>
        <a class="btn btn-success" th:href="@{/products/new}">+ New Product</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Platform</th><th>Price</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.brand.name}"></td>
                <td th:text="${p.category.name}"></td>
                <td th:text="${p.platform.displayName}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/products/{id}(id=${p.id})}">View</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a>
                    <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this product permanently?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
