<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Product | Checkpoint Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 760px;">
    <h1 class="mb-4" th:text="${product.id == null} ? 'Create Product' : 'Edit Product'">Create Product</h1>
    <form th:action="${product.id == null} ? @{/products} : @{/products/{id}/edit(id=${product.id})}"
          th:object="${product}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="name">Product Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="brand">Brand</label>
                <select id="brand" name="brand.id" class="form-select"
                        th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'">
                    <option value="">-- Select brand --</option>
                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                            th:selected="${product.brand != null and product.brand.id == b.id}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{brand}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="category">Category</label>
                <select id="category" name="category.id" class="form-select"
                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                    <option value="">-- Select category --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${product.category != null and product.category.id == c.id}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{category}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="platform">Platform</label>
                <select id="platform" th:field="*{platform}" class="form-select"
                        th:classappend="${#fields.hasErrors('platform')} ? 'is-invalid'">
                    <option value="">-- Select platform --</option>
                    <option th:each="p : ${platforms}" th:value="${p}" th:text="${p.displayName}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{platform}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="ageRating">Age Rating</label>
                <select id="ageRating" th:field="*{ageRating}" class="form-select"
                        th:classappend="${#fields.hasErrors('ageRating')} ? 'is-invalid'">
                    <option value="">-- Select rating --</option>
                    <option th:each="r : ${ageRatings}" th:value="${r}" th:text="${r.displayName}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{ageRating}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="price">Price (CAD)</label>
                <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control"
                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{price}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="releaseDate">Release Date (optional)</label>
                <input type="date" id="releaseDate" th:field="*{releaseDate}" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" rows="3" th:field="*{description}" class="form-control"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="imageUrl">Image URL</label>
            <input type="text" id="imageUrl" th:field="*{imageUrl}" class="form-control"
                   th:classappend="${#fields.hasErrors('imageUrl')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{imageUrl}"></div>
        </div>

        <button type="submit" class="btn btn-success" th:text="${product.id == null} ? 'Save Product' : 'Update Product'">Save Product</button>
        <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
