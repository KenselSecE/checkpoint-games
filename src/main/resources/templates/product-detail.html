<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name} + ' | Checkpoint Games'">Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 900px;">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="row g-4">
        <div class="col-md-6">
            <img th:src="${product.imageUrl}" th:alt="${product.name}" class="img-fluid rounded">
        </div>
        <div class="col-md-6">
            <p class="text-secondary mb-1" th:text="${product.brand.name} + ' · ' + ${product.category.name}"></p>
            <h1 th:text="${product.name}">Product name</h1>
            <h3 class="text-success my-3" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></h3>
            <p th:text="${product.description}"></p>
            <ul class="list-unstyled text-secondary">
                <li>Platform: <span th:text="${product.platform.displayName}"></span></li>
                <li>Age rating: <span th:text="${product.ageRating.displayName}"></span></li>
                <li th:if="${product.releaseDate != null}">Release date: <span th:text="${product.releaseDate}"></span></li>
                <li>Added: <span th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}"></span></li>
            </ul>
            <a th:href="@{/products/new}" class="btn btn-success">Add another product</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary">Back to catalog</a>
        </div>
    </div>
</div>
</body>
</html>
