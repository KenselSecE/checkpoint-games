<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Checkpoint Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-5" style="max-width: 480px;">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 fw-bold text-center mb-4">
                <i class="bi bi-box-arrow-in-right text-success me-2"></i>Login
            </h1>

            <!-- Alerts Restyled-->
            <div th:if="${param.error}" class="alert alert-danger rounded-3 py-2">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info rounded-3 py-2">
                <i class="bi bi-info-circle-fill me-2"></i>You have been logged out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success rounded-3 py-2">
                <i class="bi bi-check-circle-fill me-2"></i>Account created! Please log in.
            </div>
        </div>

        <!-- Input names unchanged -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 rounded-pill px-4">Login</button>
        </form>
        <div class="card-footer bg-transparent border-top border-secondary-subtle text-center py-3">
            <p class="mb-0 text-secondary">New here?
                <a th:href="@{/register}" class="text-success fw-semibold">Create an account</a>
            </p>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
